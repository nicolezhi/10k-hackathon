<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10K Creatives</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="description"
      content="Stop asking around. The short list of freelancers for a 10K shoot, with the work up front."
    />
    <link rel="preconnect" href="https://cdn.prod.website-files.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=neue-montreal@400&display=swap"
    />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <script>
      (function () {
        var frame = new URLSearchParams(location.search).get("frame") === "1";
        if (frame) {
          document.documentElement.classList.add("is-frame");
          return;
        }
        try {
          var layout = sessionStorage.getItem("10k-layout");
          if ((layout === "mobile" || layout === "intro") && matchMedia("(min-width: 801px)").matches) {
            document.documentElement.classList.add("is-device-preview");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=484" />
  </head>
  <body data-view="home">
    <div class="aura" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <header class="navbar results-top">
      <a class="nav_brand" href="/" aria-label="Draft, home">
        <span class="brand-logo" aria-hidden="true">
          <svg class="brand-logo_mark" viewBox="0 0 32 32" width="28" height="28">
            <g class="brand-logo_cam" transform="rotate(-6 14.5 17.5)">
              <rect x="8.2" y="6.8" width="8.2" height="4.2" rx="1.8" fill="#111" />
              <rect x="18.6" y="7.6" width="3.8" height="2.6" rx="1.2" fill="#111" />
              <rect x="3" y="9.6" width="22.5" height="16.2" rx="4.6" fill="#111" />
              <circle cx="14.2" cy="17.7" r="5.5" fill="#fff" />
              <circle cx="14.2" cy="17.7" r="3.2" fill="#111" />
              <circle cx="12.9" cy="16.4" r="1.15" fill="#fff" />
              <circle cx="6.8" cy="13" r="1.15" fill="#fff" />
            </g>
            <path class="brand-logo_flash" d="M26.2 1.8l1.35 3.55 3.55 1.35-3.55 1.35-1.35 3.55-1.35-3.55-3.55-1.35 3.55-1.35z" fill="#ff4d1f" />
          </svg>
          <span class="brand-logo_word">draft</span>
          <span class="brand-logo_tag">[10K]</span>
        </span>
      </a>
      <form class="search" id="search-form" role="search">
        <div class="airbnb" id="airbnb" data-open="">
          <div class="airbnb_bar">
            <div class="segment-slot">
              <button class="segment" id="where-segment" type="button" aria-expanded="false" aria-controls="where-panel">
                <span class="segment_label">Where</span>
                <span class="segment_value" id="where-value">Search cities</span>
              </button>
              <button class="segment_clear" id="where-clear" type="button" hidden aria-label="Clear city">×</button>
            </div>
            <div class="segment-slot">
              <button class="segment" id="who-segment" type="button" aria-expanded="false" aria-controls="who-panel">
                <span class="segment_label">Who</span>
                <span class="segment_value" id="who-value">Search roles</span>
              </button>
              <button class="segment_clear" id="who-clear" type="button" hidden aria-label="Clear roles">×</button>
            </div>
            <button class="airbnb_go" type="submit" aria-label="Search">
              <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
                <circle cx="10.5" cy="10.5" r="6.25" fill="none" stroke="currentColor" stroke-width="2.6" />
                <path d="M15.2 15.2 L20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
              </svg>
              <span class="airbnb_go_label">Search</span>
            </button>
          </div>
          <div class="airbnb_panel" id="where-panel" hidden>
            <label class="where-search">
              <span class="material-symbols-outlined" aria-hidden="true">search</span>
              <input id="where-filter" type="search" placeholder="Los Angeles, Memphis, Remote" autocomplete="off" aria-label="Search cities" />
            </label>
            <div class="airbnb_options" id="where-options"></div>
          </div>
          <div class="airbnb_panel" id="who-panel" hidden>
            <div class="airbnb_options airbnb_options-roles" id="who-options"></div>
            <div class="who-sub" id="who-sub" hidden></div>
          </div>
        </div>
      </form>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Menu">
        <svg class="nav-toggle_open" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
        <svg class="nav-toggle_close" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
      </button>
      <nav class="nav-links" id="nav-links" aria-label="Sections">
        <a class="nav_link" href="results.html?browse=1">Creatives</a>
        <a class="nav_link" href="boards.html">Boards</a>
      </nav>
    </header>

    <div class="home-view">
      <section class="hero" id="search">
        <figure class="hero_stage" id="hero-stage">
          <svg id="hero-map" viewBox="0 0 780 300" aria-hidden="true"></svg>
          <div class="hero_shots" id="hero-shots"></div>
        </figure>
        <svg class="ink-defs" aria-hidden="true" focusable="false">
          <filter id="ink-bleed" x="-12%" y="-30%" width="124%" height="160%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="6" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" result="spread" />
            <feGaussianBlur in="spread" stdDeviation="0.45" />
          </filter>
        </svg>
        <div class="hero-reels" id="hero-reels" aria-hidden="true"></div>
        <div class="hero-fan" id="hero-fan"></div>
        <h1>Draft the best talent</h1>
        <p class="lede">
          <span class="lede-line">A search engine to find freelance photographers, </span><span class="lede-line">videographers, stylists, models, and graphic designers. </span><span class="lede-line">See the work, then get in touch.</span>
        </p>
        <button class="intro-search" id="intro-search" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.25" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="M15.2 15.2 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <span class="search-cycle"><span class="search-cycle_keep">Search for</span><span class="search-cycle_roles"><span>photographers</span><span>videographers</span><span>stylists</span><span>models</span><span>graphic designers</span></span></span>
        </button>
      </section>

    </div>

    <article class="profile-view" id="profile" hidden>
      <div class="profile-skeleton" aria-hidden="true">
        <span class="skeleton_block skeleton_line skeleton_line-back"></span>
        <div class="profile-skeleton_head">
          <span class="skeleton_block skeleton_avatar skeleton_avatar-lg"></span>
          <span class="skeleton_copy">
            <span class="skeleton_block skeleton_line skeleton_line-name"></span>
            <span class="skeleton_block skeleton_line skeleton_line-short"></span>
            <span class="skeleton_tags"><span class="skeleton_block"></span><span class="skeleton_block"></span><span class="skeleton_block"></span></span>
          </span>
        </div>
        <div class="profile-skeleton_shots">
          <span class="skeleton_block skeleton_shot"></span>
          <span class="skeleton_block skeleton_shot"></span>
          <span class="skeleton_block skeleton_shot"></span>
        </div>
      </div>
    </article>

    <script src="people.js?v=26"></script>
    <script src="projects.js?v=46"></script>
    <script src="app.js?v=358"></script>

</html>
