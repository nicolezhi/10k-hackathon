<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #111; }
    .deck { display: flex; flex-direction: column; gap: 24px; padding: 24px; }
    .slide {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #f4f1ee;
    }
    .orb {
      position: absolute;
      display: block;
      border-radius: 50%;
      filter: blur(180px);
      pointer-events: none;
    }
    .lilac { background: #cbbfdd; }
    .blue { background: #c5d3e0; }
    .peach { background: #f0c7b4; }
    .mauve { background: #e4d3ea; }

    /* 1 — field. The app's balance, open middle. */
    .t1 .o1 { top: -28%; left: -18%; width: 70%; height: 124%; opacity: 0.42; }
    .t1 .o2 { top: -12%; right: -20%; width: 62%; height: 110%; opacity: 0.42; }
    .t1 .o3 { right: -16%; bottom: -30%; width: 68%; height: 120%; opacity: 0.42; }
    .t1 .o4 { top: 18%; left: 22%; width: 52%; height: 92%; opacity: 0.34; }

    /* 2 — corners. Quiet center for a title. */
    .t2 .o1 { top: -42%; left: -28%; width: 58%; height: 100%; opacity: 0.55; }
    .t2 .o2 { top: -36%; right: -26%; width: 52%; height: 92%; opacity: 0.5; }
    .t2 .o3 { right: -30%; bottom: -46%; width: 62%; height: 108%; opacity: 0.55; }
    .t2 .o4 { left: -24%; bottom: -40%; width: 48%; height: 86%; opacity: 0.4; }

    /* 3 — horizon. Color along the top and bottom edges. */
    .t3 .o1 { top: -48%; left: 8%; width: 84%; height: 70%; opacity: 0.5; }
    .t3 .o2 { top: -40%; right: -10%; width: 46%; height: 60%; opacity: 0.45; }
    .t3 .o3 { bottom: -50%; left: -8%; width: 78%; height: 72%; opacity: 0.55; }
    .t3 .o4 { bottom: -42%; right: 6%; width: 50%; height: 58%; opacity: 0.4; }

    /* 4 — left wash. Color mass on the left, open right. */
    .t4 .o1 { top: -20%; left: -28%; width: 62%; height: 110%; opacity: 0.55; }
    .t4 .o2 { top: 20%; left: -16%; width: 48%; height: 90%; opacity: 0.4; }
    .t4 .o3 { bottom: -36%; left: -10%; width: 58%; height: 80%; opacity: 0.5; }
    .t4 .o4 { top: -30%; right: -24%; width: 42%; height: 70%; opacity: 0.28; }

    /* 5 — glass well. Aura behind one empty frosted panel. */
    .t5 .o1 { top: -24%; left: -12%; width: 64%; height: 110%; opacity: 0.48; }
    .t5 .o2 { top: -18%; right: -16%; width: 58%; height: 100%; opacity: 0.42; }
    .t5 .o3 { right: -8%; bottom: -36%; width: 70%; height: 100%; opacity: 0.5; }
    .t5 .o4 { top: 22%; left: 28%; width: 46%; height: 80%; opacity: 0.36; }
    .well {
      position: absolute;
      left: 160px;
      right: 160px;
      top: 140px;
      bottom: 140px;
      border-radius: 36px;
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 24px 80px rgba(40, 30, 40, 0.06);
      backdrop-filter: blur(22px) saturate(1.4);
    }
  

    html, body { background: #f4f1ee; width: 1920px; height: 1080px; overflow: hidden; }
    .deck { display: block; padding: 0; gap: 0; }
    .slide { width: 1920px; height: 1080px; }

</style></head>
<body><section class="slide t3">
      <span class="orb lilac o1"></span>
      <span class="orb blue o2"></span>
      <span class="orb peach o3"></span>
      <span class="orb mauve o4"></span>
</section></body></html>
