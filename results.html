<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search · 10K Roster</title>
    <meta name="description" content="Creatives that match a 10K search." />
    <link rel="preconnect" href="https://cdn.prod.website-files.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <link rel="stylesheet" href="styles.css?v=64" />
  </head>
  <body data-page="results" data-view="home">
    <header class="results-top">
      <a class="nav_brand" href="/" aria-label="10K Projects, home">
        <img
          src="https://cdn.prod.website-files.com/6627e667ad5e5d4d27964cc3/6627ebb08215c7da6b5e8a4e_logo-b.svg"
          alt="10K Projects"
        />
      </a>
      <nav class="nav-side" aria-label="Sections">
        <a class="nav_link" href="projects.html">Projects</a>
        <a class="nav_link is-current" href="results.html">Roster</a>
      </nav>
      <form class="search" id="search-form" role="search">
        <div class="airbnb" id="airbnb" data-open="">
          <div class="airbnb_bar">
            <div class="segment-slot">
              <button class="segment" id="where-segment" type="button" aria-expanded="false" aria-controls="where-panel">
                <span class="segment_label">Where</span>
                <span class="segment_value" id="where-value">Search cities</span>
              </button>
              <button class="segment_clear" id="where-clear" type="button" hidden aria-label="Clear city">×</button>
            </div>
            <button class="segment" id="who-segment" type="button" aria-expanded="false" aria-controls="who-panel">
              <span class="segment_label">Who</span>
              <span class="segment_value" id="who-value">Add a role</span>
            </button>
            <button class="airbnb_go" type="submit" aria-label="Search">
              <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
                <circle cx="10.5" cy="10.5" r="6.25" fill="none" stroke="currentColor" stroke-width="2.6" />
                <path d="M15.2 15.2 L20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
              </svg>
              <span class="airbnb_go_label">Search</span>
            </button>
          </div>
          <div class="airbnb_panel" id="where-panel" hidden>
            <p class="panel_label panel_label-soft">Suggested cities</p>
            <label class="where-search">
              <span class="material-symbols-outlined" aria-hidden="true">search</span>
              <input id="where-filter" type="search" placeholder="Los Angeles, Memphis, Remote" autocomplete="off" aria-label="Search cities" />
            </label>
            <div class="airbnb_options" id="where-options"></div>
          </div>
          <div class="airbnb_panel" id="who-panel" hidden>
            <p class="panel_label panel_label-soft">Suggested roles</p>
            <div class="airbnb_options airbnb_options-roles" id="who-options"></div>
          </div>
        </div>
      </form>
    </header>

    <main class="results-page" data-results-view="list">
      <div class="results-tools">
        <div class="filter-wrap" id="filter-wrap">
          <button class="tool-pill" id="filters-toggle" type="button" aria-expanded="false" aria-controls="filters-panel">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              <circle cx="8" cy="7" r="2" fill="currentColor" />
              <circle cx="15" cy="12" r="2" fill="currentColor" />
              <circle cx="10" cy="17" r="2" fill="currentColor" />
            </svg>
            Filters
            <span class="tool-pill_count" id="filters-count" hidden></span>
          </button>
          <div class="filters-panel" id="filters-panel" hidden>
            <div class="filters-menu" id="filters-menu" role="menu" aria-label="Roles"></div>
            <div class="filters-sub" id="filters-sub" hidden role="menu" aria-label="Genres"></div>
          </div>
        </div>
        <button class="tool-pill tool-pill_add" id="add-roster" type="button">Add a roster</button>
      </div>

      <div class="results-split">
        <section class="results" id="results" aria-live="polite">
          <h2 id="results-title">Creatives</h2>
          <p class="summary" id="summary"></p>
          <p class="count" id="count" hidden></p>
          <p class="nearby" id="nearby" hidden></p>
          <p class="empty" id="empty" hidden>No one matches that yet.</p>
          <div class="grid" id="grid"></div>
        </section>
        <div class="map-pane">
          <div id="map" role="region" aria-label="Map of matching creatives"></div>
        </div>
      </div>
    </main>

    <article class="profile-view" id="profile" hidden></article>

    <div class="add-dialog" id="add-dialog" hidden>
      <form class="add-dialog_panel" id="add-form" novalidate role="dialog" aria-modal="true" aria-labelledby="add-title">
        <h2 id="add-title">Add a roster</h2>
        <p class="add-dialog_lede">Add someone to the roster and link how to reach them.</p>
        <label class="add-field">
          <span>Name</span>
          <input id="add-name" name="name" type="text" autocomplete="name" />
        </label>
        <label class="add-field">
          <span>City</span>
          <select id="add-city" name="city"></select>
        </label>
        <fieldset class="add-field">
          <legend>Role</legend>
          <div class="add-checks" id="add-roles"></div>
        </fieldset>
        <fieldset class="add-field">
          <legend>Genre</legend>
          <div class="add-checks" id="add-genres"></div>
        </fieldset>
        <h3 class="add-section">Contact</h3>
        <div class="add-contact">
          <label class="add-field">
            <span>Instagram</span>
            <input id="add-instagram" name="instagram" type="text" autocomplete="off" placeholder="username" />
          </label>
          <label class="add-field">
            <span>Email</span>
            <input id="add-email" name="email" type="email" autocomplete="email" placeholder="name@email.com" />
          </label>
          <label class="add-field">
            <span>Phone</span>
            <input id="add-phone" name="phone" type="tel" autocomplete="tel" placeholder="(000) 000-0000" />
          </label>
          <label class="add-field">
            <span>Portfolio</span>
            <input id="add-portfolio" name="portfolio" type="text" inputmode="url" autocomplete="url" placeholder="https://" />
          </label>
        </div>
        <fieldset class="add-field">
          <legend>Preferred contact</legend>
          <div class="add-checks" id="add-preferred">
            <label class="add-check"><input type="radio" name="preferred" value="instagram" /><span>Instagram</span></label>
            <label class="add-check"><input type="radio" name="preferred" value="email" /><span>Email</span></label>
            <label class="add-check"><input type="radio" name="preferred" value="phone" /><span>Phone</span></label>
          </div>
        </fieldset>
        <p class="add-dialog_error" id="add-error" role="alert"></p>
        <div class="add-dialog_actions">
          <button class="add-cancel" id="add-cancel" type="button">Cancel</button>
          <button class="add-submit" type="submit">Add to roster</button>
        </div>
      </form>
    </div>

    <script src="people.js?v=5"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="app.js?v=45"></script>
  </body>
</html>
