<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search · 10K Creatives</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="description" content="Creatives that match a 10K search." />
    <link rel="preconnect" href="https://cdn.prod.website-files.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <link rel="stylesheet" href="styles.css?v=242" />
  </head>
  <body data-page="results" data-view="home">
    <div class="aura" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <header class="results-top">
      <a class="nav_brand" href="/" aria-label="Draft, home">
        <span class="brand-logo" aria-hidden="true">
          <svg class="brand-logo_mark" viewBox="0 0 32 32" width="28" height="28">
            <g class="brand-logo_cam" transform="rotate(-6 14.5 17.5)">
              <rect x="8.2" y="6.8" width="8.2" height="4.2" rx="1.8" fill="#111" />
              <rect x="18.6" y="7.6" width="3.8" height="2.6" rx="1.2" fill="#111" />
              <rect x="3" y="9.6" width="22.5" height="16.2" rx="4.6" fill="#111" />
              <circle cx="14.2" cy="17.7" r="5.5" fill="#fff" />
              <circle cx="14.2" cy="17.7" r="3.2" fill="#111" />
              <circle cx="12.9" cy="16.4" r="1.15" fill="#fff" />
              <circle cx="6.8" cy="13" r="1.15" fill="#fff" />
            </g>
            <path class="brand-logo_flash" d="M26.2 1.8l1.35 3.55 3.55 1.35-3.55 1.35-1.35 3.55-1.35-3.55-3.55-1.35 3.55-1.35z" fill="#ff4d1f" />
          </svg>
          <span class="brand-logo_word">draft</span>
          <span class="brand-logo_tag">[10K]</span>
        </span>
      </a>
      <form class="search" id="search-form" role="search">
        <div class="airbnb" id="airbnb" data-open="">
          <div class="airbnb_bar">
            <div class="segment-slot">
              <button class="segment" id="where-segment" type="button" aria-expanded="false" aria-controls="where-panel">
                <span class="segment_label">Where</span>
                <span class="segment_value" id="where-value">Search cities</span>
              </button>
              <button class="segment_clear" id="where-clear" type="button" hidden aria-label="Clear city">×</button>
            </div>
            <div class="segment-slot">
              <button class="segment" id="who-segment" type="button" aria-expanded="false" aria-controls="who-panel">
                <span class="segment_label">Who</span>
                <span class="segment_value" id="who-value">Search roles</span>
              </button>
              <button class="segment_clear" id="who-clear" type="button" hidden aria-label="Clear roles">×</button>
            </div>
            <button class="airbnb_go" type="submit" aria-label="Search">
              <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
                <circle cx="10.5" cy="10.5" r="6.25" fill="none" stroke="currentColor" stroke-width="2.6" />
                <path d="M15.2 15.2 L20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
              </svg>
              <span class="airbnb_go_label">Search</span>
            </button>
          </div>
          <div class="airbnb_panel" id="where-panel" hidden>
            <label class="where-search">
              <span class="material-symbols-outlined" aria-hidden="true">search</span>
              <input id="where-filter" type="search" placeholder="Los Angeles, Memphis, Remote" autocomplete="off" aria-label="Search cities" />
            </label>
            <div class="airbnb_options" id="where-options"></div>
          </div>
          <div class="airbnb_panel" id="who-panel" hidden>
            <div class="airbnb_options airbnb_options-roles" id="who-options"></div>
            <div class="who-sub" id="who-sub" hidden></div>
          </div>
        </div>
      </form>
      <nav class="nav-links" aria-label="Sections">
        <a class="nav_link is-current" href="results.html">Creatives</a>
        <a class="nav_link" href="boards.html">Boards</a>
      </nav>
    </header>

    <main class="results-page" data-results-view="list">
      <div class="results-split">
        <section class="results" id="results" aria-live="polite">
          <div class="results-heading">
            <h2 id="results-title">Creatives</h2>
            <button class="tool-pill tool-pill_add" id="add-roster" type="button">Add a creative</button>
          </div>
          <p class="summary" id="summary"></p>
          <p class="count" id="count" hidden></p>
          <p class="nearby" id="nearby" hidden></p>
          <p class="empty" id="empty" hidden>No one matches that yet.</p>
          <div class="grid" id="grid" aria-busy="true" aria-label="Loading creatives">
            <article class="result-card skeleton" aria-hidden="true"><span class="skeleton_block skeleton_avatar"></span><span class="skeleton_copy"><span class="skeleton_block skeleton_line"></span><span class="skeleton_block skeleton_line skeleton_line-short"></span></span></article>
            <article class="result-card skeleton" aria-hidden="true"><span class="skeleton_block skeleton_avatar"></span><span class="skeleton_copy"><span class="skeleton_block skeleton_line"></span><span class="skeleton_block skeleton_line skeleton_line-short"></span></span></article>
            <article class="result-card skeleton" aria-hidden="true"><span class="skeleton_block skeleton_avatar"></span><span class="skeleton_copy"><span class="skeleton_block skeleton_line"></span><span class="skeleton_block skeleton_line skeleton_line-short"></span></span></article>
            <article class="result-card skeleton" aria-hidden="true"><span class="skeleton_block skeleton_avatar"></span><span class="skeleton_copy"><span class="skeleton_block skeleton_line"></span><span class="skeleton_block skeleton_line skeleton_line-short"></span></span></article>
            <article class="result-card skeleton" aria-hidden="true"><span class="skeleton_block skeleton_avatar"></span><span class="skeleton_copy"><span class="skeleton_block skeleton_line"></span><span class="skeleton_block skeleton_line skeleton_line-short"></span></span></article>
            <article class="result-card skeleton" aria-hidden="true"><span class="skeleton_block skeleton_avatar"></span><span class="skeleton_copy"><span class="skeleton_block skeleton_line"></span><span class="skeleton_block skeleton_line skeleton_line-short"></span></span></article>
            <article class="result-card skeleton" aria-hidden="true"><span class="skeleton_block skeleton_avatar"></span><span class="skeleton_copy"><span class="skeleton_block skeleton_line"></span><span class="skeleton_block skeleton_line skeleton_line-short"></span></span></article>
            <article class="result-card skeleton" aria-hidden="true"><span class="skeleton_block skeleton_avatar"></span><span class="skeleton_copy"><span class="skeleton_block skeleton_line"></span><span class="skeleton_block skeleton_line skeleton_line-short"></span></span></article>
          </div>
        </section>
      </div>
    </main>

    <article class="profile-view" id="profile" hidden>
      <div class="profile-skeleton" aria-hidden="true">
        <span class="skeleton_block skeleton_line skeleton_line-back"></span>
        <div class="profile-skeleton_head">
          <span class="skeleton_block skeleton_avatar skeleton_avatar-lg"></span>
          <span class="skeleton_copy">
            <span class="skeleton_block skeleton_line skeleton_line-name"></span>
            <span class="skeleton_block skeleton_line skeleton_line-short"></span>
            <span class="skeleton_tags"><span class="skeleton_block"></span><span class="skeleton_block"></span><span class="skeleton_block"></span></span>
          </span>
        </div>
        <div class="profile-skeleton_shots">
          <span class="skeleton_block skeleton_shot"></span>
          <span class="skeleton_block skeleton_shot"></span>
          <span class="skeleton_block skeleton_shot"></span>
        </div>
      </div>
    </article>

    <div class="add-dialog" id="add-dialog" hidden>
      <form class="add-dialog_panel" id="add-form" novalidate role="dialog" aria-modal="true" aria-labelledby="add-title">
        <button class="add-dialog_close" id="add-close" type="button" aria-label="Close">×</button>
        <h2 id="add-title">Add a creative</h2>
        <p class="add-dialog_lede">Add a creative to the database and enter their information</p>
        <label class="add-field">
          <span>Name</span>
          <input id="add-name" name="name" type="text" autocomplete="name" />
        </label>
        <div class="add-field">
          <span id="add-city-caption">City</span>
          <div class="add-city" id="add-city-wrap">
            <button class="add-role_toggle add-city_toggle" id="add-city-toggle" type="button" aria-expanded="false" aria-haspopup="listbox" aria-controls="add-city-panel" aria-labelledby="add-city-caption add-city-label">
              <span class="add-city_label" id="add-city-label">Select a city</span>
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 6.5 8 10.5 12 6.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
            <div class="add-city_panel" id="add-city-panel" hidden role="listbox" aria-label="City"></div>
            <input id="add-city" name="city" type="hidden" value="" />
          </div>
        </div>
        <div class="add-field add-travel_field">
          <label class="add-radio">
            <input id="add-travel" name="travel" type="checkbox" value="yes" />
            <span class="add-radio_face" aria-hidden="true"></span>
            <span>Willing to travel</span>
          </label>
          <div class="add-travel_places" id="add-travel-places" hidden>
            <span class="add-group_label">Also travels to</span>
            <div class="add-travel_list" id="add-travel-list"></div>
            <button class="add-more" id="add-travel-add" type="button">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
              <span>Add another city</span>
            </button>
          </div>
        </div>
        <div class="add-field">
          <span>Main role</span>
          <div class="add-roles">
            <div class="add-role" id="add-main-wrap">
              <div class="add-role_group">
                <button class="add-role_toggle" id="add-main-toggle" type="button" aria-expanded="false" aria-controls="add-main-panel">
                  <span id="add-main-label">Add a main role</span>
                  <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 6.5 8 10.5 12 6.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
                </button>
                <div class="add-city_panel" id="add-main-panel" hidden role="listbox" aria-label="Main role"></div>
                <div class="add-genres" id="add-main-genres" hidden></div>
              </div>
            </div>
            <div class="add-secondary" id="add-secondary-list"></div>
            <button class="add-more" id="add-secondary-add" type="button">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
              <span>Add secondary role</span>
            </button>
          </div>
        </div>
        <h3 class="add-section" id="add-bio-label">Bio</h3>
        <label class="add-field">
          <span class="sr">Bio</span>
          <textarea id="add-bio" name="bio" rows="4" aria-labelledby="add-bio-label"></textarea>
        </label>
        <h3 class="add-section">Contact</h3>
        <div class="add-contact">
          <label class="add-field">
            <span>Instagram</span>
            <span class="add-input">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="16.6" cy="7.4" r="0.9" fill="currentColor"/></svg>
              <input id="add-instagram" name="instagram" type="text" autocomplete="off" placeholder="username" />
            </span>
          </label>
          <label class="add-field">
            <span>Email</span>
            <span class="add-input">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 7.5 12 12.5 19 7.5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
              <input id="add-email" name="email" type="email" autocomplete="email" placeholder="name@email.com" />
            </span>
          </label>
          <label class="add-field">
            <span>Phone</span>
            <span class="add-input">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 5.5h2.2l1 2.4-1.4 1.1a9 9 0 0 0 4.2 4.2l1.1-1.4 2.4 1V15a1.4 1.4 0 0 1-1.5 1.4A11.4 11.4 0 0 1 6.6 7 1.4 1.4 0 0 1 8 5.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
              <input id="add-phone" name="phone" type="tel" autocomplete="tel" placeholder="(000) 000-0000" />
            </span>
          </label>
          <label class="add-field">
            <span>Portfolio</span>
            <span class="add-input">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="7.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4.6 12h14.8M12 4.6c2 2.2 3 4.7 3 7.4s-1 5.2-3 7.4c-2-2.2-3-4.7-3-7.4s1-5.2 3-7.4z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
              <input id="add-portfolio" name="portfolio" type="text" inputmode="url" autocomplete="url" placeholder="https://" />
            </span>
          </label>
        </div>
        <fieldset class="add-field">
          <legend>Preferred contact</legend>
          <div class="add-checks" id="add-preferred">
            <label class="add-check"><input type="radio" name="preferred" value="instagram" /><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="16.6" cy="7.4" r="0.9" fill="currentColor"/></svg><span>Instagram</span></label>
            <label class="add-check"><input type="radio" name="preferred" value="email" /><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 7.5 12 12.5 19 7.5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg><span>Email</span></label>
            <label class="add-check"><input type="radio" name="preferred" value="phone" /><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M8 5.5h2.2l1 2.4-1.4 1.1a9 9 0 0 0 4.2 4.2l1.1-1.4 2.4 1V15a1.4 1.4 0 0 1-1.5 1.4A11.4 11.4 0 0 1 6.6 7 1.4 1.4 0 0 1 8 5.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>Phone</span></label>
          </div>
        </fieldset>
        <p class="add-dialog_error" id="add-error" role="alert"></p>
        <div class="add-dialog_actions">
          <button class="add-cancel" id="add-cancel" type="button">Cancel</button>
          <button class="add-submit" type="submit">Add to creatives</button>
        </div>
      </form>
    </div>

    <script src="people.js?v=18"></script>
    <script src="projects.js?v=45"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="app.js?v=198"></script>
  </body>
</html>
