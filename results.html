      <form class="search" id="search-form" role="search">

            <div class="segment-slot">

    <main class="results-page" data-results-view="list">
      <div class="results-split">
        <section class="results" id="results" aria-live="polite">
          <div class="results-heading">
            <h2 id="results-title">Creatives</h2>
            <button class="tool-pill tool-pill_add" id="add-roster" type="button">
              <svg class="board-add-plus" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <circle cx="9" cy="8" r="2.7" fill="none" stroke="currentColor" stroke-width="1.7" />
                <path d="M3.6 17.4c.55-2.5 2.35-3.8 5.15-3.8 1.35 0 2.5.35 3.35 1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                <path d="M17.2 11v5.4M14.5 13.7h5.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              </svg>
              <span>Add a creative</span>
            </button>
          </div>
          <div class="results-tools" id="results-tools" hidden>
            <div class="filter-wrap" id="location-wrap">
              <button class="tool-pill" id="location-toggle" type="button" aria-expanded="false" aria-controls="location-panel">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z" fill="none" stroke="currentColor" stroke-width="1.8" />
                  <circle cx="12" cy="10" r="2.2" fill="currentColor" />
                </svg>
                Location
                <span class="tool-pill_count" id="location-count" hidden>
                  <span class="tool-pill_num"></span>
                  <svg class="tool-pill_x" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4 4 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
                </span>
              </button>
              <div class="filters-panel" id="location-panel" hidden>
                <label class="location-search">
                  <input id="location-filter" type="search" placeholder="Search cities" autocomplete="off" enterkeyhint="search" />
                </label>
                <div class="filters-menu" id="location-menu" role="menu" aria-label="Locations"></div>
              </div>
            </div>
            <div class="filter-wrap" id="filter-wrap">
              <button class="tool-pill" id="filters-toggle" type="button" aria-expanded="false" aria-controls="filters-panel">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                  <circle cx="8" cy="7" r="2" fill="currentColor" />
                  <circle cx="15" cy="12" r="2" fill="currentColor" />
                  <circle cx="10" cy="17" r="2" fill="currentColor" />

                Role

                  <svg class="tool-pill_x" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4 4 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
                </span>
              </button>
              <div class="filters-panel" id="filters-panel" hidden>
                <div class="filters-menu" id="filters-menu" role="menu" aria-label="Roles"></div>
                <div class="filters-sub" id="filters-sub" hidden role="menu" aria-label="Genres"></div>
              </div>
            </div>
          </div>

          <p class="count" id="count" hidden></p>
          <p class="nearby" id="nearby" hidden></p>
          <p class="empty" id="empty" hidden>No one matches that yet.</p>
          <div class="grid" id="grid" aria-busy="true" aria-label="Loading creatives">
            <article class="result-card skeleton" aria-hidden="true"><span class="skeleton_block skeleton_avatar"></span><span class="skeleton_copy"><span class="skeleton_block skeleton_line"></span><span class="skeleton_block skeleton_line skeleton_line-short"></span></span></article>
            <article class="result-card skeleton" aria-hidden="true"><span class="skeleton_block skeleton_avatar"></span><span class="skeleton_copy"><span class="skeleton_block skeleton_line"></span><span class="skeleton_block skeleton_line skeleton_line-short"></span></span></article>
            <article class="result-card skeleton" aria-hidden="true"><span class="skeleton_block skeleton_avatar"></span><span class="skeleton_copy"><span class="skeleton_block skeleton_line"></span><span class="skeleton_block skeleton_line skeleton_line-short"></span></span></article>
            <article class="result-card skeleton" aria-hidden="true"><span class="skeleton_block skeleton_avatar"></span><span class="skeleton_copy"><span class="skeleton_block skeleton_line"></span><span class="skeleton_block skeleton_line skeleton_line-short"></span></span></article>
            <article class="result-card skeleton" aria-hidden="true"><span class="skeleton_block skeleton_avatar"></span><span class="skeleton_copy"><span class="skeleton_block skeleton_line"></span><span class="skeleton_block skeleton_line skeleton_line-short"></span></span></article>
            <article class="result-card skeleton" aria-hidden="true"><span class="skeleton_block skeleton_avatar"></span><span class="skeleton_copy"><span class="skeleton_block skeleton_line"></span><span class="skeleton_block skeleton_line skeleton_line-short"></span></span></article>
            <article class="result-card skeleton" aria-hidden="true"><span class="skeleton_block skeleton_avatar"></span><span class="skeleton_copy"><span class="skeleton_block skeleton_line"></span><span class="skeleton_block skeleton_line skeleton_line-short"></span></span></article>
            <article class="result-card skeleton" aria-hidden="true"><span class="skeleton_block skeleton_avatar"></span><span class="skeleton_copy"><span class="skeleton_block skeleton_line"></span><span class="skeleton_block skeleton_line skeleton_line-short"></span></span></article>

    <article class="profile-view" id="profile" hidden>
      <div class="profile-skeleton" aria-hidden="true">
        <span class="skeleton_block skeleton_line skeleton_line-back"></span>
        <div class="profile-skeleton_head">
          <span class="skeleton_block skeleton_avatar skeleton_avatar-lg"></span>
          <span class="skeleton_copy">
            <span class="skeleton_block skeleton_line skeleton_line-name"></span>
            <span class="skeleton_block skeleton_line skeleton_line-short"></span>
            <span class="skeleton_tags"><span class="skeleton_block"></span><span class="skeleton_block"></span><span class="skeleton_block"></span></span>
          </span>
        </div>
        <div class="profile-skeleton_shots">
          <span class="skeleton_block skeleton_shot"></span>
          <span class="skeleton_block skeleton_shot"></span>
          <span class="skeleton_block skeleton_shot"></span>
        </div>

    <div class="add-dialog" id="add-dialog" hidden>
      <form class="add-dialog_panel" id="add-form" novalidate role="dialog" aria-modal="true" aria-labelledby="add-title">
        <button class="add-dialog_close" id="add-close" type="button" aria-label="Close">×</button>
        <h2 id="add-title">Add a creative</h2>
        <p class="add-dialog_lede">
          <span class="add-copy_wide">Enter their Instagram handle or link to add them to the network.</span>
          <span class="add-copy_narrow">Enter their Instagram handle to add them to the network.</span>
        </p>
        <label class="add-field">
          <span class="add-copy_wide">Instagram handle or link</span>
          <span class="add-copy_narrow">Instagram handle</span>
          <span class="add-input">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="16.6" cy="7.4" r="0.9" fill="currentColor"/></svg>
            <input id="add-instagram-link" name="instagramLink" type="text" autocomplete="off" placeholder="@username" aria-describedby="add-instagram-status add-lookup" />
            <svg class="add-link-check" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12.5 9.2 16.5 19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="sr" id="add-instagram-status"></span>
          </span>
          <p class="add-lookup" id="add-lookup"></p>
        </label>
        <label class="add-field">
          <span>Name</span>
          <input id="add-name" name="name" type="text" autocomplete="name" />
        </label>
        <div class="add-field">
          <span>Main role</span>
          <div class="add-roles">
            <div class="add-role" id="add-main-wrap">
              <div class="add-role_group">
                <button class="add-role_toggle" id="add-main-toggle" type="button" aria-expanded="false" aria-controls="add-main-panel">
                  <span id="add-main-label">Add a main role</span>
                  <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 6.5 8 10.5 12 6.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
                </button>
                <div class="add-city_panel" id="add-main-panel" hidden role="listbox" aria-label="Main role"></div>
                <div class="add-genres" id="add-main-genres" hidden></div>
              </div>
            </div>
          </div>
        </div>
        <div class="add-field">
          <span>Secondary role</span>
          <div class="add-roles">
            <div class="add-secondary" id="add-secondary-list"></div>
            <button class="add-more" id="add-secondary-add" type="button">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
              <span>Add secondary role</span>
            </button>
          </div>
        </div>
        <div class="add-field">
          <span id="add-city-caption">City</span>
          <div class="add-city" id="add-city-wrap">
            <button class="add-role_toggle add-city_toggle" id="add-city-toggle" type="button" aria-expanded="false" aria-haspopup="listbox" aria-controls="add-city-panel" aria-labelledby="add-city-caption add-city-label">
              <span class="add-city_label" id="add-city-label">Select a city</span>
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 6.5 8 10.5 12 6.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
            <div class="add-city_panel" id="add-city-panel" hidden role="listbox" aria-label="City"></div>
            <input id="add-city" name="city" type="hidden" value="" />
          </div>
        </div>
        <h3 class="add-section" id="add-bio-label">Bio</h3>
        <label class="add-field">
          <span class="sr">Bio</span>
          <textarea id="add-bio" name="bio" rows="4" aria-labelledby="add-bio-label" placeholder="Suggested from their Instagram"></textarea>
        </label>
        <p class="add-bio_note" id="add-bio-note" hidden>AI-generated based on their Instagram profile.</p>
        <h3 class="add-section">Contact</h3>
        <div class="add-contact">
          <label class="add-field">
            <span>Instagram</span>
            <span class="add-input">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="16.6" cy="7.4" r="0.9" fill="currentColor"/></svg>
              <input id="add-instagram" name="instagram" type="text" autocomplete="off" placeholder="username" />
            </span>
          </label>
          <label class="add-field">
            <span>Email</span>
            <span class="add-input">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 7.5 12 12.5 19 7.5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
              <input id="add-email" name="email" type="email" autocomplete="email" placeholder="name@email.com" />
            </span>
          </label>
          <label class="add-field">
            <span>Phone</span>
            <span class="add-input">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 5.5h2.2l1 2.4-1.4 1.1a9 9 0 0 0 4.2 4.2l1.1-1.4 2.4 1V15a1.4 1.4 0 0 1-1.5 1.4A11.4 11.4 0 0 1 6.6 7 1.4 1.4 0 0 1 8 5.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
              <input id="add-phone" name="phone" type="tel" autocomplete="tel" placeholder="(000) 000-0000" />
            </span>
          </label>
          <label class="add-field">
            <span>Portfolio</span>
            <span class="add-input">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="7.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4.6 12h14.8M12 4.6c2 2.2 3 4.7 3 7.4s-1 5.2-3 7.4c-2-2.2-3-4.7-3-7.4s1-5.2 3-7.4z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
              <input id="add-portfolio" name="portfolio" type="text" inputmode="url" autocomplete="url" placeholder="https://" />
            </span>
          </label>
        </div>
        <div class="add-dialog_actions">
          <p class="add-dialog_error" id="add-error" role="alert"></p>
          <button class="add-cancel" id="add-cancel" type="button">Cancel</button>
          <button class="add-submit" type="submit" disabled>Add to creatives</button>
        </div>
      </form>
    </div>
